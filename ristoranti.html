<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4 Ristoranti — Aggiungi / Modifica</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{
  --bordeaux-0:#1a0409; --bordeaux-1:#2a0810; --bordeaux-2:#3d0a15;
  --line:#4a1420; --line-soft:#331019; --panel:#28060d;
  --gold:#d4af5a; --gold-soft:#e8c882; --gold-dim:#8a7040;
  --text-hi:#f7ece9; --text-mid:#cbaaa8; --text-lo:#8f6b6a;
}
*{box-sizing:border-box;}
html,body{ margin:0; min-height:100vh; overflow-x:hidden; max-width:100vw; background:var(--bordeaux-0); color:var(--text-hi); font-family:'Plus Jakarta Sans',system-ui,sans-serif; }
body{ background: radial-gradient(900px 460px at 10% -10%, #4a1220 0%, transparent 60%), radial-gradient(900px 500px at 100% 0%, #2a0f14 0%, transparent 55%), var(--bordeaux-0); }
h1,h2,.font-display{ font-family:'Playfair Display',Georgia,serif; }
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-track{ background:var(--bordeaux-0); }
::-webkit-scrollbar-thumb{ background:#5a2130; border-radius:8px; }

#topbar{ position:sticky; top:0; z-index:40; background:linear-gradient(180deg,rgba(26,4,9,.96),rgba(26,4,9,.9)); backdrop-filter:blur(14px); border-bottom:1px solid var(--line-soft); padding:1rem 1rem; display:flex; align-items:center; gap:.8rem; }
.back-btn{ width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; background:var(--bordeaux-1); border:1px solid var(--line); color:var(--text-mid); text-decoration:none; flex:none; }
.back-btn:hover{ background:var(--bordeaux-2); color:var(--gold-soft); }
.brand-badge{ width:36px; height:36px; border-radius:11px; border:2px solid var(--gold); flex:none; display:flex; align-items:center; justify-content:center; font-family:'Playfair Display',serif; font-weight:800; color:var(--gold-soft); font-size:.85rem; }
#page-title{ font-size:1.05rem; font-weight:800; margin:0; }

.wrap{ max-width:640px; margin:0 auto; padding:1.4rem 1rem 4rem; }

.field-label{ font-size:.72rem; font-weight:700; color:var(--text-mid); text-transform:uppercase; letter-spacing:.03em; margin-top:.4rem; display:block; }
.field-input{ background:var(--bordeaux-1); border:1px solid var(--line); color:var(--text-hi); border-radius:12px; padding:.6rem .85rem; font-size:.9rem; font-family:inherit; outline:none; transition:border-color .15s ease, box-shadow .15s ease; width:100%; }
.field-input::placeholder{ color:var(--text-lo); }
.field-input:focus{ border-color:var(--gold); box-shadow:0 0 0 3px rgba(212,175,90,.18); }
textarea.field-input{ resize:vertical; min-height:52px; }

.btn-primary{ background:linear-gradient(135deg,var(--gold),#b8863f); color:#2a1200; font-weight:800; border:none; border-radius:12px; padding:.7rem 1.2rem; font-size:.9rem; cursor:pointer; transition:transform .15s ease, box-shadow .15s ease; box-shadow:0 10px 24px -10px rgba(212,175,90,.55); }
.btn-primary:hover{ transform:translateY(-1px); box-shadow:0 14px 28px -10px rgba(212,175,90,.7); }
.btn-primary:disabled{ opacity:.6; cursor:not-allowed; transform:none; }
.btn-secondary{ background:var(--bordeaux-1); color:var(--text-mid); font-weight:700; border:1px solid var(--line); border-radius:12px; padding:.7rem 1.2rem; font-size:.9rem; cursor:pointer; transition:background .15s ease; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; }
.btn-secondary:hover{ background:var(--bordeaux-2); color:var(--text-hi); }
.btn-danger{ background:rgba(239,68,68,.12); color:#fca5a5; font-weight:700; border:1px solid rgba(239,68,68,.35); border-radius:12px; padding:.7rem 1rem; font-size:.85rem; cursor:pointer; transition:background .15s ease; width:100%; }
.btn-danger:hover{ background:rgba(239,68,68,.22); }

.restaurant-form{ display:flex; flex-direction:column; gap:.55rem; }
.form-actions{ display:flex; gap:.7rem; margin-top:1rem; }
.form-actions .btn-primary, .form-actions .btn-secondary{ flex:1; }
.login-error{ color:#fca5a5; background:rgba(239,68,68,.12); border:1px solid rgba(239,68,68,.35); border-radius:10px; padding:.55rem .8rem; font-size:.8rem; margin:.3rem 0 0; }

.star-row{ position:relative; display:inline-flex; font-size:1.05rem; line-height:1; letter-spacing:.12em; }
.star-bg, .star-fg{ white-space:nowrap; }
.star-bg{ color:#4a2230; }
.star-fg{ position:absolute; top:0; left:0; overflow:hidden; color:var(--gold); }
.star-input-mount .star-row{ cursor:pointer; touch-action:manipulation; padding:2px 0; }
.star-input-mount .star-row:focus{ outline:2px solid var(--gold); outline-offset:3px; border-radius:4px; }

.ratings-block{ display:flex; flex-direction:column; gap:.55rem; background:var(--bordeaux-1); border:1px solid var(--line); border-radius:14px; padding:.8rem .9rem; margin-top:.3rem; }
.rating-row{ display:flex; align-items:center; gap:.6rem; }
.rating-label{ font-size:.82rem; color:var(--text-mid); width:6.2rem; flex:none; }
.rating-value{ font-size:.8rem; font-weight:700; color:var(--gold-soft); width:2.2rem; text-align:right; flex:none; }

.media-preview{ display:flex; align-items:center; justify-content:space-between; background:rgba(212,175,90,.08); border:1px solid rgba(212,175,90,.3); border-radius:14px; padding:.65rem .95rem; margin-top:.2rem; }
.media-preview-label{ font-size:.78rem; color:var(--text-mid); font-weight:600; }
.media-preview-value{ font-family:'Playfair Display',serif; font-size:1.3rem; font-weight:800; color:var(--gold-soft); }

.photo-drop{ border:1.5px dashed var(--line); border-radius:14px; padding:1.1rem; text-align:center; cursor:pointer; color:var(--text-mid); font-size:.82rem; transition:border-color .15s ease, background .15s ease; }
.photo-drop:hover{ border-color:var(--gold-dim); background:rgba(212,175,90,.05); }
.photo-preview-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:.5rem; margin-top:.1rem; }
.photo-thumb{ position:relative; aspect-ratio:1; border-radius:10px; overflow:hidden; background:var(--bordeaux-2); }
.photo-thumb img{ width:100%; height:100%; object-fit:cover; }
.photo-thumb-remove{ position:absolute; top:3px; right:3px; width:22px; height:22px; border-radius:999px; border:none; background:rgba(10,2,4,.75); color:#fff; font-size:.75rem; cursor:pointer; display:flex; align-items:center; justify-content:center; }

.toast{ position:fixed; left:50%; bottom:24px; transform:translate(-50%,20px); z-index:1000; background:linear-gradient(135deg,var(--panel),var(--bordeaux-1)); border:1px solid var(--line); color:var(--text-hi); padding:.8rem 1.2rem; border-radius:14px; font-size:.85rem; font-weight:600; box-shadow:0 20px 40px -15px rgba(0,0,0,.7); opacity:0; pointer-events:none; transition:opacity .3s ease, transform .3s ease; max-width:90vw; text-align:center; }
.toast.show{ opacity:1; transform:translate(-50%,0); }
.toast.error{ border-color:rgba(239,68,68,.5); color:#fca5a5; }
</style>
</head>
<body>

<header id="topbar">
  <a href="index_ristoranti.html" class="back-btn" aria-label="Torna alla lista">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"/></svg>
  </a>
  <div class="brand-badge">4R</div>
  <h1 id="page-title">Nuovo ristorante</h1>
</header>

<div class="wrap">
  <form id="restaurant-form" class="restaurant-form">
    <input type="hidden" id="f-id">

    <label class="field-label" for="f-nome">Nome del ristorante *</label>
    <input id="f-nome" class="field-input" type="text" required placeholder="Es. Trattoria da Luigi">

    <label class="field-label" for="f-data">Data della visita</label>
    <input id="f-data" class="field-input" type="date">

    <label class="field-label" for="f-descrizione">Descrizione breve</label>
    <textarea id="f-descrizione" class="field-input" rows="2" placeholder="Due parole sul locale, il tipo di cucina, l'atmosfera..."></textarea>

    <div class="ratings-block">
      <div class="rating-row" data-cat="location">
        <span class="rating-label">🏰 Location</span>
        <div class="star-input-mount"></div>
        <span class="rating-value">0.0</span>
      </div>
      <div class="rating-row" data-cat="menu">
        <span class="rating-label">📜 Menu</span>
        <div class="star-input-mount"></div>
        <span class="rating-value">0.0</span>
      </div>
      <div class="rating-row" data-cat="servizio">
        <span class="rating-label">🤵 Servizio</span>
        <div class="star-input-mount"></div>
        <span class="rating-value">0.0</span>
      </div>
      <div class="rating-row" data-cat="prezzo">
        <span class="rating-label">💶 Prezzo</span>
        <div class="star-input-mount"></div>
        <span class="rating-value">0.0</span>
      </div>
    </div>

    <div class="media-preview">
      <span class="media-preview-label">Media finale</span>
      <span id="form-media-value" class="media-preview-value">0.0</span>
    </div>

    <label class="field-label" for="f-note">Note personali</label>
    <textarea id="f-note" class="field-input" rows="2" placeholder='Es. "Da riprovare la cacio e pepe", "Tavolo esterno ventilato"...'></textarea>

    <label class="field-label">Foto</label>
    <div id="photo-drop" class="photo-drop">
      <input id="f-foto" type="file" accept="image/*" multiple hidden>
      <p>📷 Tocca per aggiungere foto (puoi selezionarne più di una)</p>
    </div>
    <div id="photo-preview-grid" class="photo-preview-grid"></div>

    <label class="field-label" for="f-autore">Aggiunto da <span style="text-transform:none; font-weight:400; opacity:.7;">(facoltativo)</span></label>
    <input id="f-autore" class="field-input" type="text" placeholder="Es. il tuo nome">

    <div id="form-error" class="login-error" hidden></div>

    <div class="form-actions">
      <a href="index_ristoranti.html" class="btn-secondary">Annulla</a>
      <button type="submit" id="form-submit" class="btn-primary">Salva</button>
    </div>

    <button type="button" id="delete-btn" class="btn-danger" style="margin-top:.6rem;" hidden>🗑️ Elimina ristorante</button>
  </form>
</div>

<div id="toast" class="toast"></div>

<script>
/* IndexedDB — stessa base dati usata da index_ristoranti.html */
const IDB_NAME = 'quattroRistorantiDB';
const IDB_VERSION = 1;
const IDB_STORE = 'ristoranti';

function idbOpen(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(IDB_NAME, IDB_VERSION);
    req.onupgradeneeded = (e)=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains(IDB_STORE)){
        db.createObjectStore(IDB_STORE, { keyPath:'id' });
      }
    };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbGet(id){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readonly');
    const req = tx.objectStore(IDB_STORE).get(id);
    req.onsuccess = ()=> resolve(req.result || null);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbPut(record){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(record);
    tx.oncomplete = ()=> resolve(record);
    tx.onerror = ()=> reject(tx.error);
  });
}
async function idbDelete(id){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).delete(id);
    tx.oncomplete = ()=> resolve();
    tx.onerror = ()=> reject(tx.error);
  });
}

/* ---------------- Toast ---------------- */
let toastTimer = null;
function showToast(msg, isError){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('error', !!isError);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 3200);
}

/* ---------------- Compressione immagini (canvas -> dataURL) ---------------- */
function compressImageFile(file, maxDim=1000, quality=0.72){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=> reject(new Error('Impossibile leggere il file.'));
    reader.onload = (e)=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error('File immagine non valido.'));
      img.onload = ()=>{
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          if(width > height){ height = Math.round(height*(maxDim/width)); width = maxDim; }
          else { width = Math.round(width*(maxDim/height)); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ---------------- Star rating input (mezze stelle) ---------------- */
function clampPct(v){ return Math.max(0, Math.min(100, v)); }
function starRowMarkup(){ return `<span class="star-row"><span class="star-bg">★★★★★</span><span class="star-fg" style="width:0%">★★★★★</span></span>`; }

function createStarInput(mountEl, initialValue, onChange){
  mountEl.innerHTML = starRowMarkup();
  const row = mountEl.querySelector('.star-row');
  const fg = mountEl.querySelector('.star-fg');
  row.tabIndex = 0;
  row.setAttribute('role', 'slider');
  row.setAttribute('aria-valuemin', '0');
  row.setAttribute('aria-valuemax', '5');

  let value = initialValue || 0;
  function render(){
    fg.style.width = clampPct(value/5*100) + '%';
    row.setAttribute('aria-valuenow', String(value));
  }
  function setFromClientX(clientX){
    const rect = row.getBoundingClientRect();
    let ratio = (clientX - rect.left) / rect.width;
    ratio = Math.max(0, Math.min(1, ratio));
    value = Math.round(ratio*5*2)/2;
    render();
    onChange(value);
  }
  row.addEventListener('click', (e)=> setFromClientX(e.clientX));
  row.addEventListener('keydown', (e)=>{
    if(e.key==='ArrowRight' || e.key==='ArrowUp'){ e.preventDefault(); value=Math.min(5,value+0.5); render(); onChange(value); }
    if(e.key==='ArrowLeft' || e.key==='ArrowDown'){ e.preventDefault(); value=Math.max(0,value-0.5); render(); onChange(value); }
  });
  render();
  return { get: ()=>value, set: (v)=>{ value=v||0; render(); } };
}

const ratingInputs = {};
function initRatingInputs(){
  document.querySelectorAll('.rating-row').forEach(row=>{
    const cat = row.dataset.cat;
    const mount = row.querySelector('.star-input-mount');
    const valueEl = row.querySelector('.rating-value');
    ratingInputs[cat] = createStarInput(mount, 0, (v)=>{
      valueEl.textContent = v.toFixed(1);
      updateMediaPreview();
    });
  });
}
function updateMediaPreview(){
  const vals = Object.values(ratingInputs).map(i=>i.get());
  const avg = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 0;
  document.getElementById('form-media-value').textContent = avg.toFixed(1);
}

/* ---------------- Foto: stato locale del form ---------------- */
let pendingPhotos = [];   // File objects appena selezionati (da comprimere al salvataggio)
let keptPhotoUrls = [];   // dataURL già presenti (in modifica) che l'utente NON ha rimosso

function renderPhotoPreview(){
  const grid = document.getElementById('photo-preview-grid');
  grid.innerHTML = '';
  keptPhotoUrls.forEach((url, idx)=>{
    const div = document.createElement('div');
    div.className = 'photo-thumb';
    div.innerHTML = `<img src="${url}" alt=""><button type="button" class="photo-thumb-remove" data-kind="kept" data-idx="${idx}">✕</button>`;
    grid.appendChild(div);
  });
  pendingPhotos.forEach((file, idx)=>{
    const div = document.createElement('div');
    div.className = 'photo-thumb';
    const url = URL.createObjectURL(file);
    div.innerHTML = `<img src="${url}" alt=""><button type="button" class="photo-thumb-remove" data-kind="pending" data-idx="${idx}">✕</button>`;
    grid.appendChild(div);
  });
}
document.getElementById('photo-drop').addEventListener('click', ()=> document.getElementById('f-foto').click());
document.getElementById('f-foto').addEventListener('change', (e)=>{
  pendingPhotos.push(...Array.from(e.target.files));
  renderPhotoPreview();
  e.target.value = '';
});
document.getElementById('photo-preview-grid').addEventListener('click', (e)=>{
  const btn = e.target.closest('.photo-thumb-remove');
  if(!btn) return;
  const idx = parseInt(btn.dataset.idx, 10);
  if(btn.dataset.kind === 'kept') keptPhotoUrls.splice(idx,1);
  else pendingPhotos.splice(idx,1);
  renderPhotoPreview();
});

/* ---------------- Carica record esistente se stiamo modificando ---------------- */
const params = new URLSearchParams(location.search);
const editingId = params.get('id');

async function initForm(){
  initRatingInputs();
  if(!editingId) return;
  try{
    const r = await idbGet(editingId);
    if(!r){ showToast('Ristorante non trovato', true); return; }
    document.getElementById('page-title').textContent = 'Modifica ristorante';
    document.getElementById('f-id').value = r.id;
    document.getElementById('f-nome').value = r.nome || '';
    document.getElementById('f-data').value = r.data_visita || '';
    document.getElementById('f-descrizione').value = r.descrizione || '';
    document.getElementById('f-note').value = r.note || '';
    document.getElementById('f-autore').value = r.autore || '';
    ratingInputs.location.set(Number(r.voto_location)||0);
    ratingInputs.menu.set(Number(r.voto_menu)||0);
    ratingInputs.servizio.set(Number(r.voto_servizio)||0);
    ratingInputs.prezzo.set(Number(r.voto_prezzo)||0);
    document.querySelectorAll('.rating-row').forEach(row=>{
      row.querySelector('.rating-value').textContent = ratingInputs[row.dataset.cat].get().toFixed(1);
    });
    updateMediaPreview();
    keptPhotoUrls = [...(r.foto || [])];
    renderPhotoPreview();
    document.getElementById('delete-btn').hidden = false;
  }catch(err){
    console.error(err);
    showToast('Errore nel caricamento del ristorante', true);
  }
}

/* ---------------- Submit ---------------- */
function showFormError(msg){ const el = document.getElementById('form-error'); el.textContent = msg; el.hidden = false; }
function hideFormError(){ document.getElementById('form-error').hidden = true; }

document.getElementById('restaurant-form').addEventListener('submit', async (e)=>{
  e.preventDefault();
  hideFormError();

  const nome = document.getElementById('f-nome').value.trim();
  if(!nome){ showFormError('Il nome del ristorante è obbligatorio.'); return; }

  const submitBtn = document.getElementById('form-submit');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Salvataggio...';

  try{
    let newPhotoUrls = [];
    if(pendingPhotos.length){
      submitBtn.textContent = `Comprimo le foto (0/${pendingPhotos.length})...`;
      for(let i=0; i<pendingPhotos.length; i++){
        newPhotoUrls.push(await compressImageFile(pendingPhotos[i]));
        submitBtn.textContent = `Comprimo le foto (${i+1}/${pendingPhotos.length})...`;
      }
    }
    submitBtn.textContent = 'Salvataggio...';

    const now = new Date().toISOString();
    const record = {
      id: editingId || ('r_' + Date.now() + '_' + Math.random().toString(36).slice(2,8)),
      nome,
      data_visita: document.getElementById('f-data').value || null,
      descrizione: document.getElementById('f-descrizione').value.trim(),
      voto_location: ratingInputs.location.get(),
      voto_menu: ratingInputs.menu.get(),
      voto_servizio: ratingInputs.servizio.get(),
      voto_prezzo: ratingInputs.prezzo.get(),
      note: document.getElementById('f-note').value.trim(),
      autore: document.getElementById('f-autore').value.trim(),
      foto: [...keptPhotoUrls, ...newPhotoUrls],
      createdAt: editingId ? undefined : now,
      updatedAt: now,
    };
    if(editingId){
      const existing = await idbGet(editingId);
      record.createdAt = (existing && existing.createdAt) || now;
    }

    await idbPut(record);
    location.href = 'index_ristoranti.html';
  }catch(err){
    console.error(err);
    if(err && err.name === 'QuotaExceededError'){
      showFormError('Spazio esaurito nel browser: prova a rimuovere qualche foto o a usarne di meno.');
    } else {
      showFormError('Errore durante il salvataggio. Riprova.');
    }
    submitBtn.disabled = false;
    submitBtn.textContent = 'Salva';
  }
});

document.getElementById('delete-btn').addEventListener('click', async ()=>{
  if(!editingId) return;
  if(!confirm('Eliminare questo ristorante dalla lista? L\'operazione non è reversibile.')) return;
  try{
    await idbDelete(editingId);
    location.href = 'index_ristoranti.html';
  }catch(err){
    console.error(err);
    showToast('Errore durante l\'eliminazione', true);
  }
});

initForm();
</script>
</body>
</html>
